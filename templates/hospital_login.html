<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LifeLink - Hospital Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: white;
            border-radius: 18px;
            padding: 42px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #17447e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4d9e2;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #17447e;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #17447e;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #123663;
        }

        .error {
            background: #ffe8e8;
            color: #b42318;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">🏥</div>

    <h1>Hospital Login</h1>

    <p class="subtitle">
        LifeLink Hospital Screening
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="email">
            Hospital Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter hospital email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login to Screening
        </button>

    </form>

    <div class="footer">
        Authorized hospital personnel only
    </div>

</div>

</body>

</html>
