<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Blood Inventory - LifeLink</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            margin: 0;

            background-color: #f5f7fb;
        }


        .header {

            background-color: #17447e;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .header h1 {

            margin: 0;
        }


        .logout {

            background-color: #c62828;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;
        }


        .container {

            max-width: 600px;

            margin: 60px auto;

            padding: 20px;
        }


        .box {

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.1);
        }


        h2 {

            color: #17447e;

            margin-top: 0;

            text-align: center;
        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 20px;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }


        input[readonly] {

            background-color: #f1f1f1;
        }


        .update-button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #17447e;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .update-button:hover {

            background-color: #12365f;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #17447e;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            🩸 LifeLink Admin
        </h1>


        <a
            href="/admin/logout"
            class="logout">

            Logout

        </a>

    </div>



    <div class="container">


        <div class="box">


            <h2>
                ✏️ Update Blood Inventory
            </h2>


            <form
                method="POST">


                <label>
                    Blood Group
                </label>

                <input
                    type="text"
                    value="{{ inventory.blood_group }}"
                    readonly>



                <label>
                    Blood Bank ID
                </label>

                <input
                    type="text"
                    value="{{ inventory.blood_bank_id or 'N/A' }}"
                    readonly>



                <label>
                    Units Available
                </label>

                <input
                    type="number"
                    name="units_available"
                    min="0"
                    value="{{ inventory.units_available }}"
                    required>



                <button
                    type="submit"
                    class="update-button">

                    💾 Update Inventory

                </button>

            </form>


            <a
                href="/admin/inventory"
                class="back">

                ← Back to Inventory

            </a>


        </div>

    </div>


</body>

</html>
