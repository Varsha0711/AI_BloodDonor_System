<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Blood Stock - LifeLink</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            margin: 0;

            background-color: #f5f7fb;
        }


        .header {

            background-color: #17447e;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .header h1 {

            margin: 0;
        }


        .logout {

            background-color: #c62828;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;
        }


        .container {

            max-width: 600px;

            margin: 60px auto;

            padding: 20px;
        }


        .box {

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.1);
        }


        h2 {

            color: #17447e;

            text-align: center;

            margin-top: 0;
        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 20px;

            margin-bottom: 7px;
        }


        select,
        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }


        .add-button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #2e7d32;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .add-button:hover {

            background-color: #256428;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #17447e;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            🩸 LifeLink Admin
        </h1>


        <a
            href="/admin/logout"
            class="logout">

            Logout

        </a>

    </div>



    <div class="container">


        <div class="box">


            <h2>
                ➕ Add Blood Stock
            </h2>


            <form method="POST">


                <label>
                    Blood Group
                </label>


                <select
                    name="blood_group"
                    required>


                    <option value="">
                        -- Select Blood Group --
                    </option>


                    <option value="A+">
                        A+
                    </option>


                    <option value="A-">
                        A-
                    </option>


                    <option value="B+">
                        B+
                    </option>


                    <option value="B-">
                        B-
                    </option>


                    <option value="AB+">
                        AB+
                    </option>


                    <option value="AB-">
                        AB-
                    </option>


                    <option value="O+">
                        O+
                    </option>


                    <option value="O-">
                        O-
                    </option>


                </select>



                <label>
                    Units to Add
                </label>


                <input
                    type="number"
                    name="units_to_add"
                    min="1"
                    placeholder="Enter number of units"
                    required>



                <button
                    type="submit"
                    class="add-button">

                    ➕ Add Blood Stock

                </button>

            </form>


            <a
                href="/admin/inventory"
                class="back">

                ← Back to Inventory

            </a>


        </div>

    </div>


</body>

</html>
