<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Registration - LifeLink</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fb,
                    #e8eef8
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        /* MAIN CARD */

        .register-box {

            width: 100%;
            max-width: 650px;

            background-color: white;

            padding: 35px 45px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.12);
        }


        /* HEADER */

        .logo {

            text-align: center;

            font-size: 42px;

            margin-bottom: 5px;
        }


        h1 {

            text-align: center;

            color: #173f7a;

            margin: 5px 0;

            font-size: 30px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            font-size: 15px;
        }


        /* SECTION */

        .section {

            margin-top: 25px;

            margin-bottom: 18px;

            padding-bottom: 8px;

            border-bottom: 2px solid #e5e9f0;
        }


        .section h3 {

            color: #173f7a;

            margin: 0;

            font-size: 18px;
        }


        /* FORM */

        label {

            display: block;

            font-weight: bold;

            color: #444;

            margin-top: 15px;

            margin-bottom: 7px;
        }


        input,
        select {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ccd3df;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            background-color: white;

            transition: 0.2s;
        }


        input:focus,
        select:focus {

            border-color: #173f7a;

            box-shadow:
                0 0 0 3px rgba(23,63,122,0.10);
        }


        input::placeholder {

            color: #999;
        }


        /* REGISTER BUTTON */

        .register-button {

            width: 100%;

            padding: 14px;

            margin-top: 28px;

            border: none;

            border-radius: 8px;

            background-color: #173f7a;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .register-button:hover {

            background-color: #0f2d5a;

            transform: translateY(-1px);
        }


        /* LOGIN */

        .login-link {

            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #ddd;
        }


        .login-link p {

            color: #666;

            margin-bottom: 12px;
        }


        .login-button {

            display: inline-block;

            padding: 10px 25px;

            border-radius: 7px;

            border: 2px solid #173f7a;

            background-color: white;

            color: #173f7a;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }


        .login-button:hover {

            background-color: #173f7a;

            color: white;
        }


        /* REQUIRED */

        .required {

            color: #c62828;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 20px;

            color: #888;

            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {

                padding: 15px;

            }

            .register-box {

                padding: 25px 22px;

            }

            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


<div class="register-box">


    <!-- HEADER -->

    <div class="logo">
        🩸
    </div>


    <h1>
        Donor Registration
    </h1>


    <p class="subtitle">
        Join LifeLink and help save lives
    </p>



    <form
        action="/donor/register"
        method="POST">


        <!-- =================================================
             ACCOUNT DETAILS
        ================================================== -->

        <div class="section">

            <h3>
                🔐 Account Details
            </h3>

        </div>


        <label>
            Name <span class="required">*</span>
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label>
            Email <span class="required">*</span>
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email address"
            required
        >


        <label>
            Password <span class="required">*</span>
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >



        <!-- =================================================
             DONOR DETAILS
        ================================================== -->

        <div class="section">

            <h3>
                👤 Donor Information
            </h3>

        </div>


        <label>
            Blood Group <span class="required">*</span>
        </label>

        <select
            name="blood_group"
            required>

            <option value="">
                -- Select Blood Group --
            </option>

            <option value="O-">O-</option>
            <option value="O+">O+</option>

            <option value="A-">A-</option>
            <option value="A+">A+</option>

            <option value="B-">B-</option>
            <option value="B+">B+</option>

            <option value="AB-">AB-</option>
            <option value="AB+">AB+</option>

        </select>



        <label>
            Age <span class="required">*</span>
        </label>

        <input
            type="number"
            name="age"
            min="18"
            max="65"
            placeholder="Enter your age"
            required
        >



        <label>
            Gender <span class="required">*</span>
        </label>

        <select
            name="gender"
            required>

            <option value="">
                -- Select Gender --
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>



        <label>
            Phone <span class="required">*</span>
        </label>

        <input
            type="text"
            name="phone"
            placeholder="Enter your phone number"
            required
        >



        <label>
            Location <span class="required">*</span>
        </label>

        <select
            name="location"
            required>

            <option value="">
                -- Select Location --
            </option>

            <option value="Chennai">
                Chennai
            </option>

            <option value="Trichy">
                Trichy
            </option>

            <option value="Madurai">
                Madurai
            </option>

            <option value="Coimbatore">
                Coimbatore
            </option>

            <option value="Salem">
                Salem
            </option>

            <option value="Erode">
                Erode
            </option>

            <option value="Vellore">
                Vellore
            </option>

            <option value="Thanjavur">
                Thanjavur
            </option>

            <option value="Tirunelveli">
                Tirunelveli
            </option>

            <option value="Kanchipuram">
                Kanchipuram
            </option>

            <option value="Pondicherry">
                Pondicherry
            </option>

            <option value="Hosur">
                Hosur
            </option>

            <option value="Dindigul">
                Dindigul
            </option>

            <option value="Thoothukudi">
                Thoothukudi
            </option>

            <option value="Nagercoil">
                Nagercoil
            </option>

        </select>



        <label>
            Last Donation Date
        </label>

        <input
            type="date"
            name="last_donation_date"
        >



        <!-- REGISTER -->

        <button
            type="submit"
            class="register-button">

            🩸 Register as Donor

        </button>


    </form>



    <!-- LOGIN -->

    <div class="login-link">

        <p>
            Already have an account?
        </p>


        <a
            href="/login"
            class="login-button">

            Login

        </a>

    </div>


    <div class="footer">

        LifeLink — AI-Powered Smart Blood Donor System

    </div>


</div>


</body>

</html>
