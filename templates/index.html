<!DOCTYPE html>
<html>

<head>

    <title>AI-Powered Smart Blood Donor System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            font-family: Arial, sans-serif;

            background-color: #f5f7fb;
        }

        .home-container {
            background: white;

            padding: 60px 70px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);

            max-width: 800px;
            width: 90%;
        }

        h1 {
            margin: 0 0 20px 0;

            font-size: 38px;

            color: #17447e;
        }

        h2 {
            margin: 0 0 35px 0;

            font-size: 24px;

            color: #333;
        }

        .login-button {
            display: inline-block;

            padding: 13px 55px;

            background-color: #17447e;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 18px;

            font-weight: bold;
        }

        .login-button:hover {
            background-color: #123663;
        }

    </style>

</head>


<body>

    <div class="home-container">

        <h1>
            AI-Powered Smart Blood Donor System
        </h1>

        <h2>
            Save Lives. Find Blood Faster.
        </h2>

        <a
            href="/login"
            class="login-button">

            LOGIN

        </a>

    </div>

</body>

</html>
